<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowers for You 🌻</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a10;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
    }
    
    /* Background Canvas */
    #sunflowerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Ambient Glow Overlay */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 30%, rgba(9, 10, 16, 0.85) 90%);
      z-index: 2;
    }
    
    /* Main Content Container */
    .ui-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 1.5rem;
      pointer-events: none;
    }
    
    /* Header Styling */
    .header {
      text-align: center;
      animation: fadeInDown 1.4s ease-out forwards;
      pointer-events: auto;
    }

    .main-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 7vw, 5rem);
      background: linear-gradient(135deg, #ffe17d 0%, #ffb703 50%, #fb8500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 45px rgba(255, 183, 3, 0.35);
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }
    
    /* Footer & Controls */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      pointer-events: auto;
      animation: fadeInUp 1.4s ease-out forwards;
    }
    
    .action-btn {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      padding: 0.75rem 1.8rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    
    .action-btn:hover {
      background: rgba(255, 183, 3, 0.2);
      border-color: rgba(255, 183, 3, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 183, 3, 0.25);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    /* Startup Dialog Overlay */
    .startup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 16, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      transition: opacity 0.6s ease;
    }

    .startup-card {
      background: linear-gradient(145deg, rgba(35, 38, 54, 0.95), rgba(18, 20, 31, 0.98));
      border: 1px solid rgba(255, 183, 3, 0.35);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(255, 183, 3, 0.2);
      text-align: center;
    }

    .startup-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      color: #ffe17d;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
    }

    .startup-card p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Side-by-Side Buttons Container */
    .startup-btns {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      position: relative;
      width: 100%;
      height: 60px;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #090a10;
      font-weight: 700;
      border: none;
      padding: 0.85rem 2.2rem;
      border-radius: 9999px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(251, 133, 0, 0.4);
      transition: all 0.3s;
      z-index: 2;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 25px rgba(251, 133, 0, 0.6);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease-out;
      white-space: nowrap;
      z-index: 1;
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="sunflowerCanvas"></canvas>
  <div class="vignette"></div>

  <!-- Interactive Startup Menu -->
  <div class="startup-overlay" id="startupOverlay">
    <div class="startup-card">
      <h2>Flowers for you 🌻</h2>
      <p>Would you like to accept this flower?</p>
      <div class="startup-btns" id="btnContainer">
        <button class="btn-yes" id="yesBtn">Yes!</button>
        <button class="btn-no" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <div class="ui-container">
    <div class="header">
      <h1 class="main-title">Flowers for you, locci :) 🌻</h1>
    </div>
    
    <div class="footer">
      <button class="action-btn" id="rebloomBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Rebloom Sunflower
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('sunflowerCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas Resize Handler
    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Animation States & Timings
    let bloomProgress = 0;
    let bloomStartTime = null;
    const BLOOM_DURATION = 3800; // ms

    // Seed/Petal Golden Ratio Calculations
    const GOLDEN_ANGLE = 137.50776405003785 * (Math.PI / 180);
    const SEED_COUNT = 520;
    const PETAL_COUNT = 38;

    // Ambient Floating Dust Particles
    const ambientParticles = Array.from({ length: 65 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2 + 0.6,
      alpha: Math.random() * 0.6 + 0.2,
      speedY: Math.random() * 0.4 + 0.15,
      speedX: (Math.random() - 0.5) * 0.3
    }));

    // Sparkle Explosions Array
    let sparks = [];
    function spawnSparks(x, y) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.5 + 1.2;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          alpha: 1,
          color: `hsl(${Math.random() * 25 + 40}, 100%, ${Math.random() * 30 + 60}%)`
        });
      }
    }

    // Tap & Click Event Listeners for Sparks
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'BUTTON') {
        spawnSparks(e.clientX, e.clientY);
      }
    });

    // Exact Sunflower Scale matching Screenshot
    function getSingleSunflower() {
      const isMobile = width < 600;
      return {
        x: width / 2,
        y: height + 40,
        targetY: height * 0.64,
        scale: isMobile ? 1.25 : 1.55
      };
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function updateAndDrawAmbient() {
      ctx.fillStyle = 'rgba(255, 225, 125, 0.7)';
      ambientParticles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        if (p.y < -10) p.y = height + 10;
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        ctx.beginPath();
        ctx.globalAlpha = p.alpha;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawStemAndLeaves(flower, growth) {
      const stemHeight = (height + 40) - flower.targetY;
      const currentHeight = stemHeight * growth;
      const startY = height + 40;
      const endY = startY - currentHeight;

      // Stem Curve
      ctx.beginPath();
      ctx.moveTo(flower.x, startY);
      const controlX = flower.x + Math.sin(growth * Math.PI) * 18;
      const controlY = startY - currentHeight * 0.5;
      ctx.quadraticCurveTo(controlX, controlY, flower.x, endY);
      ctx.strokeStyle = '#2d5a27';
      ctx.lineWidth = 12 * flower.scale;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Stem Inner Highlight
      ctx.strokeStyle = '#437a3c';
      ctx.lineWidth = 4 * flower.scale;
      ctx.stroke();

      // Leaves Growth
      if (growth > 0.35) {
        const leafProgress = Math.min(1, (growth - 0.35) / 0.5);
        const leafScale = easeInOutCubic(leafProgress) * flower.scale;
        
        // Left Leaf
        ctx.save();
        ctx.translate(flower.x - 3, startY - currentHeight * 0.45);
        ctx.rotate(-0.55);
        ctx.beginPath();
        ctx.ellipse(0, 0, 40 * leafScale, 16 * leafScale, 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#2d5a27';
        ctx.fill();
        ctx.restore();

        // Right Leaf
        ctx.save();
        ctx.translate(flower.x + 3, startY - currentHeight * 0.6);
        ctx.rotate(0.48);
        ctx.beginPath();
        ctx.ellipse(0, 0, 44 * leafScale, 18 * leafScale, -0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#34662d';
        ctx.fill();
        ctx.restore();
      }

      return { headX: flower.x, headY: endY };
    }

    function drawPetals(headX, headY, bloomProgress, scale) {
      if (bloomProgress <= 0) return;

      const petalLength = 88 * scale * bloomProgress;
      const petalWidth = 24 * scale * bloomProgress;
      const time = Date.now() * 0.0015;

      // Soft Outer Sunflower Glow
      const glowGrad = ctx.createRadialGradient(headX, headY, 10, headX, headY, petalLength * 1.25);
      glowGrad.addColorStop(0, 'rgba(255, 183, 3, 0.35)');
      glowGrad.addColorStop(1, 'rgba(255, 183, 3, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(headX, headY, petalLength * 1.25, 0, Math.PI * 2);
      ctx.fill();

      // Double Layer Petal Ring matching Screenshot
      for (let layer = 0; layer < 2; layer++) {
        const layerScale = layer === 0 ? 1 : 0.82;
        const count = layer === 0 ? PETAL_COUNT : PETAL_COUNT - 4;
        const offsetAngle = layer * (Math.PI / PETAL_COUNT);

        for (let i = 0; i < count; i++) {
          const angle = (i * (Math.PI * 2 / count)) + offsetAngle;
          const sway = Math.sin(time + i) * 0.025;

          ctx.save();
          ctx.translate(headX, headY);
          ctx.rotate(angle + sway);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-petalWidth * 0.5 * layerScale, petalLength * 0.5 * layerScale, 0, petalLength * layerScale);
          ctx.quadraticCurveTo(petalWidth * 0.5 * layerScale, petalLength * 0.5 * layerScale, 0, 0);

          const grad = ctx.createLinearGradient(0, 0, 0, petalLength * layerScale);
          if (layer === 0) {
            grad.addColorStop(0, '#e65c00');
            grad.addColorStop(0.35, '#ffb703');
            grad.addColorStop(0.85, '#ffd166');
            grad.addColorStop(1, '#fff3b0');
          } else {
            grad.addColorStop(0, '#cc5200');
            grad.addColorStop(0.4, '#ffa200');
            grad.addColorStop(1, '#ffe17d');
          }

          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function drawCenterDisk(headX, headY, bloomProgress, scale) {
      const diskRadius = 45 * scale * Math.min(1, bloomProgress * 1.2);
      if (diskRadius <= 0) return;

      // Dark Mahogany Core Base
      const baseGrad = ctx.createRadialGradient(headX, headY, 0, headX, headY, diskRadius);
      baseGrad.addColorStop(0, '#1a0a03');
      baseGrad.addColorStop(0.75, '#3d1e0b');
      baseGrad.addColorStop(1, '#5c2e0b');
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.arc(headX, headY, diskRadius, 0, Math.PI * 2);
      ctx.fill();

      // Golden Spiral Seed Distribution
      const visibleSeeds = Math.floor(SEED_COUNT * bloomProgress);
      for (let i = 0; i < visibleSeeds; i++) {
        const r = Math.sqrt(i / SEED_COUNT) * diskRadius * 0.95;
        const theta = i * GOLDEN_ANGLE;

        const x = headX + r * Math.cos(theta);
        const y = headY + r * Math.sin(theta);
        const seedRadius = (1.3 + (r / diskRadius) * 1.4) * scale;

        ctx.beginPath();
        ctx.arc(x, y, seedRadius, 0, Math.PI * 2);

        const ratio = r / diskRadius;
        if (ratio < 0.35) {
          ctx.fillStyle = '#2b1408';
        } else if (ratio < 0.75) {
          ctx.fillStyle = '#6b3e11';
        } else {
          ctx.fillStyle = '#b8860b';
        }
        ctx.fill();
      }
    }

    function updateAndDrawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.08;
        s.alpha -= 0.02;

        if (s.alpha <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.globalAlpha = s.alpha;
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Main Animation Frame Loop
    function animate(timestamp) {
      if (!bloomStartTime) bloomStartTime = timestamp;
      const elapsed = timestamp - bloomStartTime;
      const progress = Math.min(1, elapsed / BLOOM_DURATION);
      bloomProgress = easeInOutCubic(progress);

      ctx.clearRect(0, 0, width, height);

      // Render Layers
      updateAndDrawAmbient();

      const flower = getSingleSunflower();
      const stemGrowth = Math.min(1, bloomProgress * 1.35);
      const headPos = drawStemAndLeaves(flower, stemGrowth);

      if (bloomProgress > 0.3) {
        const petalProgress = (bloomProgress - 0.3) / 0.7;
        drawPetals(headPos.headX, headPos.headY, petalProgress, flower.scale);
        drawCenterDisk(headPos.headX, headPos.headY, petalProgress, flower.scale);
      }

      updateAndDrawSparks();

      requestAnimationFrame(animate);
    }

    // Interactive Startup Overlay & Dodging "No" Button
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const startupOverlay = document.getElementById('startupOverlay');

    const noTexts = [
      "No",
      "Are you sure?",
      "Think again!",
      "Nice try!",
      "Cannot click this!",
      "Over here!",
      "Still No?",
      "Just click Yes! ❤️"
    ];
    let noClickCount = 0;

    function moveNoBtn() {
      const cardRect = startupOverlay.querySelector('.startup-card').getBoundingClientRect();
      
      const maxX = (cardRect.width / 2) - 50;
      const maxY = 70;

      const randomX = (Math.random() * maxX * 2) - maxX;
      const randomY = (Math.random() * maxY * 2) - maxY;

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
      
      noClickCount++;
      noBtn.textContent = noTexts[noClickCount % noTexts.length];
    }

    noBtn.addEventListener('mouseenter', moveNoBtn);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoBtn(); });

    yesBtn.addEventListener('click', () => {
      startupOverlay.style.opacity = '0';
      setTimeout(() => startupOverlay.style.display = 'none', 600);
      bloomStartTime = null;
    });

    // Rebloom Button
    document.getElementById('rebloomBtn').addEventListener('click', () => {
      bloomStartTime = null;
    });

    // Start Loop
    window.onload = () => {
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
